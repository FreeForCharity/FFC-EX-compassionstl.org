name: CI - Build and Test

on:
  # Runs on all pull requests
  pull_request:
    branches: ['main']

  # Runs on pushes to main (before deploy)
  push:
    branches: ['main']

  # Allows manual trigger from Actions tab
  workflow_dispatch:

# Cancel in-progress CI runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm test
        env:
          CI: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js site
        run: npm run build
        # Note: Do NOT set NEXT_PUBLIC_BASE_PATH here
        # The basePath is only needed for actual GitHub Pages deployment (in deploy.yml)
        # E2E tests need to run against a build without basePath since the test server
        # (serve -s out) doesn't understand basePath routing

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload build artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            .next/
            out/
          retention-days: 7

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    # Validates the site's own navigation and in-page anchors against a
    # locally served copy of the static export, so extensionless routes
    # (e.g. /resources) resolve the way GitHub Pages serves them instead of
    # 404ing against resources.html on the raw filesystem. External links
    # are skipped (see .linkinatorrc.json) to keep the check from flaking on
    # third-party outages. Kept non-blocking as a safety net.
    continue-on-error: true
    # Kept as a separate job (not inside test-and-build) so it does not
    # multiply across the Playwright shard matrix introduced by #133.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build

      - name: Check for broken links
        run: |
          npx serve out -l 3200 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3200/ >/dev/null 2>&1 && break
            sleep 1
          done
          npm run check-links
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS
